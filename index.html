<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sliding Puzzle Game</title>
    <link rel="icon" href="https://i.im.ge/2024/12/21/zxyJnD.image.png" type="image/png">
    <link rel="stylesheet" href="https://pyscript.net/alpha/pyscript.css">
    <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
    <script type="module" src="firebase.js"></script>
    <!-- <script type="module" src="sqlite.js"></script> -->

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #20232a;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 110vh;
            margin: 0;
        }
        h1 {
            margin-bottom: 20px;
        }
        #puzzle-grid {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 5px;
        }
        .tile {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            background-color: #61dafb;
            border: 2px solid #20232a;
            cursor: pointer;
        }
        .empty {
            background-color: #20232a;
            cursor: default;
        }
        #controls {
            margin-top: 20px;
        }
        button {
            font-size: 16px;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border: none;
            background-color: #61dafb;
            color: #20232a;
            border-radius: 5px;
            width: 100px;
        }
        #message {
            margin-top: 15px;
            font-size: 18px;
            color: #61dafb;
        }
        #move-count {
            margin-bottom: 15px;
        }
        
        /* Ranking Table Styles */
        #ranking-container {
            position: absolute;
            top: 30px;
            right: 20px;
            background-color: #333744;
            border: 2px solid #61dafb;
            border-radius: 10px;
            padding: 15px;
            width: 300px;
            color: white;
        }
        #ranking-container h2 {
            margin-top: 0px;
        }
        #ranking-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        #ranking-table th, #ranking-table td {
            border: 1px solid #61dafb;
            padding: 5px;
            text-align: center;
        }
        #ranking-table th {
            background-color: #61dafb;
            color: #20232a;
        }
        #ranking-table tr:nth-child(even) {
            background-color: #282c34;
        }

        #solve-btn{
            font-size: 0;
            padding: 20px 20px;
            margin: 5px;
            cursor: pointer;
            border: none;
            background-color: #20232a;
            color: #20232a; 
            border-radius: 5px;
            width: 10px;
            position: fixed; 
            bottom: 0px;    
            left: 0px;      
        }
        #toggleButton {
            position: relative; 
            top: 5px; 
        }

    </style>
</head>
<body>
    <h1 style="font-size: 30px;">Sliding Puzzle Game</h1>
    <div id="puzzle-grid"></div>
    <div id="controls">
        <button id="shuffle-btn">Shuffle</button>
        <button id="again-btn">Again</button>
    </div>
    <p id="message"></p>
    <p id="move-count">Moves: 0</p>

    <!-- Ranking Table -->
    <div id="ranking-container">
        <h2>Rankings</h2>
        <table id="ranking-table">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Player</th>
                    <th>Moves</th>
                    <th>Best</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <button id="toggleButton">Hide</button>
    </div>
    <button id="solve-btn">Solve</button>    

    <script>
        const toggleButton = document.getElementById('toggleButton');
        const table = document.getElementById('ranking-table');

        toggleButton.addEventListener('click', () => {
            if (table.style.display === 'none') {
                table.style.display = 'table';
                toggleButton.textContent = 'Hide';
            } else {
                table.style.display = 'none';
                toggleButton.textContent = 'Show';
            }
        });
    </script>


    <py-script src="control.py"></py-script>
</body>
</html>
